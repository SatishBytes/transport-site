    <circle cx="127.0" cy="235.0" r="27" fill="#0f172a"/><g class="spin" style="transform-origin:127.0px 235.0px"><circle cx="127.0" cy="235.0" r="12" fill="#94a3b8"/><line x1="131.00" y1="235.00" x2="137.50" y2="235.00" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="128.24" y1="238.80" x2="130.24" y2="244.99" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="123.76" y1="237.35" x2="118.51" y2="241.17" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="123.76" y1="232.65" x2="118.51" y2="228.83" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="128.24" y1="231.20" x2="130.24" y2="225.01" stroke="#334155" stroke-width="3" stroke-linecap="round"/></g><circle cx="127.0" cy="235.0" r="4" fill="#0f172a"/>
    <circle cx="535.0" cy="235.0" r="27" fill="#0f172a"/><g class="spin" style="transform-origin:535.0px 235.0px"><circle cx="535.0" cy="235.0" r="12" fill="#94a3b8"/><line x1="539.00" y1="235.00" x2="545.50" y2="235.00" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="536.24" y1="238.80" x2="538.24" y2="244.99" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="531.76" y1="237.35" x2="526.51" y2="241.17" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="531.76" y1="232.65" x2="526.51" y2="228.83" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="536.24" y1="231.20" x2="538.24" y2="225.01" stroke="#334155" stroke-width="3" stroke-linecap="round"/></g><circle cx="535.0" cy="235.0" r="4" fill="#0f172a"/>
