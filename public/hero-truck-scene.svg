<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Goods transport truck driving on a highway</title>
  <desc id="d">Illustration of a navy and white goods truck driving along a road with hills, clouds and a sun in the background.</desc>
  <style>
    .spin{animation:spin .9s linear infinite}
    .road{animation:road .6s linear infinite}
    .bob{animation:bob .7s ease-in-out infinite alternate}
    .cloud1{animation:drift 26s ease-in-out infinite alternate}
    .cloud2{animation:drift 34s ease-in-out infinite alternate-reverse}
    .glow{animation:glow 4s ease-in-out infinite alternate}
    .speed{animation:speed 1.2s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes road{to{stroke-dashoffset:60}}
    @keyframes bob{to{transform:translateY(-2px)}}
    @keyframes drift{to{transform:translateX(70px)}}
    @keyframes glow{to{opacity:.35;transform:scale(1.12)}}
    @keyframes speed{0%{opacity:0;transform:translateX(18px)}50%{opacity:.7}100%{opacity:0;transform:translateX(-26px)}}
    @media (prefers-reduced-motion: reduce){.spin,.road,.bob,.cloud1,.cloud2,.glow,.speed{animation:none}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="720" height="480" fill="url(#sky)"/>
