  <circle cx="586" cy="104" r="46" fill="#fbbf24"/>
  <g class="cloud1" opacity=".9"><ellipse cx="130" cy="96" rx="58" ry="17" fill="#fff"/><ellipse cx="164" cy="84" rx="34" ry="16" fill="#fff"/></g>
  <g class="cloud2" opacity=".8"><ellipse cx="380" cy="150" rx="50" ry="14" fill="#fff"/><ellipse cx="408" cy="140" rx="28" ry="13" fill="#fff"/></g>
