<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">16 feet goods transport vehicle</title>
  <desc id="d">Side view illustration of a 16 feet closed-body goods vehicle with a navy cab and amber stripe.</desc>
  <style>
    .spin{animation:spin 1s linear infinite}
    .road{animation:road 0.7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes road{to{stroke-dashoffset:32}}
    @media (prefers-reduced-motion: reduce){.spin,.road{animation:none}}
  </style>
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <ellipse cx="320.0" cy="268" rx="264.0" ry="9" fill="#0f172a" opacity=".16"/>
  <line class="road" x1="16" y1="276" x2="624" y2="276" stroke="#94a3b8" stroke-width="3" stroke-dasharray="18 14" stroke-linecap="round" opacity=".55"/>
  <!-- chassis -->
  <rect x="76.0" y="196" width="488" height="14" rx="3" fill="#334155"/>
  <!-- cargo box -->
  <rect x="76.0" y="64" width="352" height="132" rx="8" fill="url(#box)" stroke="#94a3b8" stroke-width="2"/>
  <rect x="76.0" y="162" width="352" height="10" fill="#f59e0b"/>
  <rect x="76.0" y="174" width="352" height="22" fill="#0f172a" opacity=".9"/>
  <line x1="252.0" y1="72" x2="252.0" y2="160" stroke="#cbd5e1" stroke-width="2"/>
  <text x="252.0" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="46" fill="#0f172a">16 FT</text>
  <text x="252.0" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" letter-spacing="3" fill="#b45309">GOODS TRANSPORT</text>
  <!-- cab -->
  <path d="M436.0 86 H498.0 L558.0 142 Q564.0 148 564.0 158 V210 H436.0 Z" fill="url(#cab)"/>
  <path d="M450.0 98 H492.0 L534.0 142 H450.0 Z" fill="#bae6fd" opacity=".92"/>
  <rect x="550.0" y="162" width="12" height="16" rx="3" fill="#fde68a"/>
  <rect x="558.0" y="194" width="10" height="18" rx="3" fill="#475569"/>
  <rect x="444.0" y="168" width="26" height="5" rx="2.5" fill="#f59e0b"/>
  <!-- wheels -->
  <g>
    <circle cx="138.0" cy="235.0" r="27" fill="#0f172a"/><g class="spin" style="transform-origin:138.0px 235.0px"><circle cx="138.0" cy="235.0" r="12" fill="#94a3b8"/><line x1="142.00" y1="235.00" x2="148.50" y2="235.00" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="139.24" y1="238.80" x2="141.24" y2="244.99" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="134.76" y1="237.35" x2="129.51" y2="241.17" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="134.76" y1="232.65" x2="129.51" y2="228.83" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="139.24" y1="231.20" x2="141.24" y2="225.01" stroke="#334155" stroke-width="3" stroke-linecap="round"/></g><circle cx="138.0" cy="235.0" r="4" fill="#0f172a"/>
    <circle cx="524.0" cy="235.0" r="27" fill="#0f172a"/><g class="spin" style="transform-origin:524.0px 235.0px"><circle cx="524.0" cy="235.0" r="12" fill="#94a3b8"/><line x1="528.00" y1="235.00" x2="534.50" y2="235.00" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="525.24" y1="238.80" x2="527.24" y2="244.99" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="520.76" y1="237.35" x2="515.51" y2="241.17" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="520.76" y1="232.65" x2="515.51" y2="228.83" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="525.24" y1="231.20" x2="527.24" y2="225.01" stroke="#334155" stroke-width="3" stroke-linecap="round"/></g><circle cx="524.0" cy="235.0" r="4" fill="#0f172a"/>
  </g>
  <!-- length marker -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="76.0" y1="292" x2="428.0" y2="292"/>
    <line x1="76.0" y1="286" x2="76.0" y2="298"/>
    <line x1="428.0" y1="286" x2="428.0" y2="298"/>
